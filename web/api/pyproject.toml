[project]
name = "sdd-web-api"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "click>=8.1",
    "rich>=13.7",
    "anthropic>=0.101.0",
    "openai>=2.36.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.4", "pytest>=8.0", "httpx>=0.27"]

[project.scripts]
sdd-web = "main:app"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["sdd_cli"]
