[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdd-cli"
version = "0.1.58"
description = "Spec-Driven Development CLI – Blueprint für sprachneutrales SDD"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Boris" }]
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "rich>=13.7",
    "openai>=2.36.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.0",
    "anthropic>=0.25",
    "httpx>=0.27",
    "pywebpush>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
evaluate = [
    "anthropic>=0.40",
    "httpx>=0.27",
]
lm-studio = [
    "openai>=1.0",
    "httpx>=0.27",
]

[project.scripts]
sdd = "sdd_cli.main:cli"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["sdd_cli*"]

[tool.setuptools.package-data]
sdd_cli = [
    "blueprint/config.yaml",
    "blueprint/templates/*",
    "blueprint/templates/**/*",
    "blueprint/schemas/*",
    "web/api/*.py",
    "web/api/routes/*.py",
    "web/ui/dist/*",
    "web/ui/dist/**/*",
    "web/pwa/dist/*",
    "web/pwa/dist/**/*",
    "hub/templates/*",
]
