<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="fillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#6366f1" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="22" fill="url(#bg)"/>

  <!-- Outer outline square — rotated 12° for depth -->
  <rect x="13" y="13" width="102" height="102" rx="14"
        fill="none" stroke="#6366f1" stroke-width="2"
        opacity="0.25" transform="rotate(12, 64, 64)"/>

  <!-- Middle outline square — rotated 6° -->
  <rect x="23" y="23" width="82" height="82" rx="11"
        fill="none" stroke="#818cf8" stroke-width="2"
        opacity="0.5" transform="rotate(6, 64, 64)"/>

  <!-- Inner outline square — aligned -->
  <rect x="33" y="33" width="62" height="62" rx="9"
        fill="none" stroke="#a5b4fc" stroke-width="1.5"
        opacity="0.75"/>

  <!-- Filled center square -->
  <rect x="38" y="38" width="52" height="52" rx="8"
        fill="url(#fillGrad)" filter="url(#shadow)"/>

  <!-- sdd label -->
  <text x="64" y="70"
        font-size="17" font-family="'Segoe UI', 'Arial', sans-serif" font-weight="800"
        fill="white" text-anchor="middle" letter-spacing="1"
        filter="url(#glow)">sdd</text>
</svg>
