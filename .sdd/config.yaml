version: 1.0.0
project:
  name: SDD-Framer
  description: Spec-Driven Development CLI und Blueprint-System für strukturierte Softwareentwicklung
  owners:
  - Boris
ids:
  spec_prefix: SPEC
  contract_prefix: CON
  test_prefix: TST
  adr_prefix: ADR
  holdout_prefix: HOL
  padding: 4
spec_lifecycle:
- draft
- review
- approved
- in-progress
- implemented
- evaluation-failed
- deprecated
contract_formats:
  api:
  - openapi
  - asyncapi
  - graphql
  - grpc
  data:
  - json-schema
  - avro
  - protobuf
  behavior:
  - gherkin
  - markdown
  performance:
  - slo-yaml
validation:
  require_contract_per_spec: true
  require_test_per_contract: true
  fail_on_orphans: true
  allowed_statuses_for_implementation:
  - approved
  - implemented
traceability:
  output_format: markdown
  output_path: docs/traceability.md
evaluator:
  model: claude-sonnet-4-6
  base_url: https://localhost:8000
  timeout_per_scenario: 60
  runs_per_scenario: 3   # nur für Legacy-Holdouts (Prosa-Format)
  pass_threshold: 2
  cost_alert_usd: 1.0
  container:
    start_command: ["sdd", "hub", "--port", "8080", "--no-tunnel"]
    app_port: 8080
    host_port: 18080
    health_path: /health
    health_timeout_secs: 30
    env:
      SDD_ENV: test
orchestrator:
  build_command: ''
  auto_merge: false
  auto_merge_strategy: label
  max_retries: 3
maintenance:
  stale_after_weeks: 4
obsidian:
  vault_path: /home/deck/Documents/Obsidian/Vault 33/Development
  subfolder: SDD Framer
  watch_interval_secs: 5
  auto_wiki_links: true
test_runner:
  command: pytest
  extra_args: []
  timeout_per_spec: 120
cost_estimation:
  model_prices:
    claude-haiku-4-5-20251001:
      input_per_million: 0.8
      output_per_million: 4.0
      cache_write_per_million: 1.0
      cache_read_per_million: 0.08
    claude-sonnet-4-6:
      input_per_million: 3.0
      output_per_million: 15.0
      cache_write_per_million: 3.75
      cache_read_per_million: 0.3
    default:
      input_per_million: 3.0
      output_per_million: 15.0
      cache_write_per_million: 3.75
      cache_read_per_million: 0.3
  budget_alert_usd: 5.0
  default_model: claude-haiku-4-5-20251001
# LLM-Routing ist standardmäßig KEYFREI: die Komponente 'completion' (Contract-Review,
# SOLID-Check, Pattern-Vorschläge) nutzt ohne Konfiguration den claude-cli-Provider
# (Claude-Code-CLI headless, kein ANTHROPIC_API_KEY). anthropic/openai-compat/huggingface
# bleiben als explizites Opt-in über llm.<component>.provider wählbar (SPEC-0050).
llm:
  ai_routes:
    provider: claude-cli
  evaluator:
    provider: claude-cli
    model: claude-sonnet-4-6
  completion:
    provider: openai-compat
    base_url: http://192.168.0.149:1234/v1
    model: qwen3.6-35b-a3b
    api_key: lm-studio
    temperature: 0.0
    enable_thinking: false
  orchestrator:
    provider: openai-compat
    base_url: http://192.168.0.149:1234/v1
    model: qwen3.6-35b-a3b
    api_key: lm-studio
    enable_thinking: false
  local_llm:
    provider: openai-compat
    base_url: http://192.168.0.149:1234/v1
    model: qwen3.6-35b-a3b
    api_key: lm-studio
    temperature: 0.0
    enable_thinking: false
task_routing:
  enabled: true
  complexity_threshold: 30
  max_concurrent: 3
  max_retries: 3
solid_gate:
  enabled: true
  mode: warn
pattern_suggestions:
  enabled: true
  max_suggestions: 4
  source: refactoring-guru
docker:
  runtime: podman
  image: sdd-dev:latest
  dockerfile: .sdd/Dockerfile
  registry:
    url: ''
    auth_env: ''
  compose_file: ''
  log_stream:
    enabled: true
    max_lines: 500
pwa:
  auth:
    token: 1dcc9db3d45429d5606a6dfbc53c2cc0db8f3454f62008e016f21a358f94395d
title: SDD Framer
hub:
  port: 8100
