version: 1.0.0
project:
  name: SDD-Framer
  description: Spec-Driven Development CLI und Blueprint-System für strukturierte Softwareentwicklung
  owners:
  - Boris
ids:
  spec_prefix: SPEC
  contract_prefix: CON
  test_prefix: TST
  adr_prefix: ADR
  holdout_prefix: HOL
  padding: 4
spec_lifecycle:
- draft
- review
- approved
- in-progress
- implemented
- evaluation-failed
- deprecated
contract_formats:
  api:
  - openapi
  - asyncapi
  - graphql
  - grpc
  data:
  - json-schema
  - avro
  - protobuf
  behavior:
  - gherkin
  - markdown
  performance:
  - slo-yaml
validation:
  require_contract_per_spec: true
  require_test_per_contract: true
  fail_on_orphans: true
  allowed_statuses_for_implementation:
  - approved
  - implemented
compliance:
  # Schalter der Compliance-Kette (finalize/spec approve). Default jeweils true.
  fr_coverage_check: true       # jede FR braucht einen zugeordneten Test
  task_completion_check: true   # alle Tasks der Spec muessen abgeschlossen sein
  type_aware_test_check: true   # typabhaengige Testebenen (webui/api)
  route_registration_check: true # neue Routen sind registriert
  post_commit_hook: true        # pre-commit-Gate aktiv
adr:
  output_dir: docs/adr
traceability:
  output_format: markdown
  output_path: docs/traceability.md
evaluator:
  model: claude-sonnet-4-6
  base_url: https://localhost:8000
  timeout_per_scenario: 60
  # Wiederholungen pro Legacy-Szenario (Prosa-Format). 1, weil der
  # Legacy-Pfad den Zustand zwischen Laeufen nicht zuruecksetzt:
  # Lauf 2 sieht, was Lauf 1 angelegt hat. Erst mit Isolierung erhoehen.
  runs_per_scenario: 1
  pass_threshold: 2
  cost_alert_usd: 1.0
  container:
    start_command: ["sdd", "hub", "--port", "8080", "--no-tunnel"]
    app_port: 8080
    host_port: 18080
    host: 127.0.0.1
    health_path: /health
    health_timeout_secs: 30
    env:
      SDD_ENV: test
orchestrator:
  build_command: ''
  auto_merge: false
  auto_merge_strategy: label
  max_retries: 3
maintenance:
  stale_after_weeks: 4
obsidian:
  vault_path: /home/deck/Documents/Obsidian/Vault 33/Development
  subfolder: SDD Framer
  watch_interval_secs: 5
  auto_wiki_links: true
test_runner:
  command: pytest
  extra_args: []
  timeout_per_spec: 120
cost_estimation:
  model_prices:
    claude-haiku-4-5-20251001:
      input_per_million: 0.8
      output_per_million: 4.0
      cache_write_per_million: 1.0
      cache_read_per_million: 0.08
    claude-sonnet-4-6:
      input_per_million: 3.0
      output_per_million: 15.0
      cache_write_per_million: 3.75
      cache_read_per_million: 0.3
    default:
      input_per_million: 3.0
      output_per_million: 15.0
      cache_write_per_million: 3.75
      cache_read_per_million: 0.3
  budget_alert_usd: 5.0
  default_model: claude-haiku-4-5-20251001
# LLM-Routing ist standardmäßig KEYFREI: die Komponente 'completion' (Contract-Review,
# SOLID-Check, Pattern-Vorschläge) nutzt ohne Konfiguration den claude-cli-Provider
# (Claude-Code-CLI headless, kein ANTHROPIC_API_KEY). anthropic/openai-compat/huggingface
# bleiben als explizites Opt-in über llm.<component>.provider wählbar (SPEC-0050).
llm:
  # Zeitlimit fuer einen einzelnen LLM-Aufruf (Sekunden).
  # Der Regression-Check braucht fuer groessere Specs mehrere Minuten.
  timeout_seconds: 600
  # Zeitlimit fuer die Testcode-Generierung in `sdd start` (Sekunden).
  # Bei umfangreichen Test-Dokumenten und claude-cli kann 300 knapp sein.
  test_generation_timeout: 300
  ai_routes:
    provider: claude-cli
  evaluator:
    provider: claude-cli
  analyzer:
    provider: claude-cli
  completion:
    provider: claude-cli
  orchestrator:
    provider: claude-cli
  # Lokaler MLX-Server (Qwen3.5-35B-A3B) auf 192.168.0.149:8080. Nutzt die
  # ":no-think"-Modellvariante, da dieser Server extra_body.enable_thinking
  # (anders als LM Studio) ignoriert — ohne den Suffix denkt das Modell und
  # content bleibt bei knappem max_tokens leer (finish_reason=length).
# [SPEC-0062]   local_llm:
# [SPEC-0062]     provider: openai-compat
# [SPEC-0062]     base_url: http://192.168.0.149:8080/v1
# [SPEC-0062]     model: mlx-community/Qwen3.5-35B-A3B-OptiQ-4bit:no-think
# [SPEC-0062]     api_key: sk-optiq-local  # Server verlangt Bearer-Token im Format "sk-optiq-*"
# [SPEC-0062]     temperature: 0.0
  profiles:
    lokal:
      provider: openai-compat
      base_url: http://192.168.0.149:8080/v1
      model: mlx-community/Qwen3.5-35B-A3B-OptiQ-4bit:no-think
      api_key: sk-optiq-local
      temperature: 0.0
  roles:
    implementer:
      by_complexity:
        low: lokal
        medium: lokal
# [SPEC-0062] task_routing:
# [SPEC-0062]   enabled: true
# [SPEC-0062]   # 50 statt Default 30: decide_routing() mappt complexity-Label auf Score
# [SPEC-0062]   # low=15, medium=50, high=80 (task_exec.py). Mit 30 liefe nur "low" lokal;
# [SPEC-0062]   # 50 nimmt zusätzlich "medium" mit (inklusiver Vergleich score<=threshold),
# [SPEC-0062]   # "high" bleibt bei Claude. Kostet im Worst Case 2 verlorene lokale Versuche
# [SPEC-0062]   # vor Eskalation (task-exec Retry-Grenze in /sdd-implement Schritt 4c).
# [SPEC-0062]   complexity_threshold: 50
# [SPEC-0062]   max_concurrent: 3
# [SPEC-0062]   max_retries: 3
solid_gate:
  enabled: true
  mode: warn
pattern_suggestions:
  enabled: true
  max_suggestions: 4
  source: refactoring-guru
docker:
  # Abzweigpunkt fuer den Entwicklungsbranch von `sdd start`.
  # Ohne Angabe wird vom aktuellen HEAD abgezweigt — noetig, wenn
  # eine Spec auf einer noch nicht gemergten Vorgaengerin aufbaut.
  # base_branch: main
  runtime: podman
  image: sdd-dev:latest
  dockerfile: .sdd/Dockerfile
  registry:
    url: ''
    auth_env: ''
  compose_file: ''
  log_stream:
    enabled: true
    max_lines: 500
pwa:
  auth:
    # Leer: der Token steht in .sdd/config.local.yaml (gitignored) und
    # ueberlagert diesen Wert (#103). Neu erzeugen: POST /api/auth/generate-token.
    token: ''
title: SDD Framer
hub:
  port: 8100
