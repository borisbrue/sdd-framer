name: SDD Pipeline

# Startet für jede geänderte Spec `sdd pipeline run <SPEC> --auto` (SPEC-0062 FR-08).
# Im CI gibt es keine lokale `claude`-CLI: die Rollen brauchen in .sdd/config.yaml ein Profil
# mit erreichbarem Modell (llm.profiles / llm.roles), und keine Rolle darf im Modus `session`
# stehen. Nur wer ausdrücklich `provider: anthropic` wählt, legt das Secret ANTHROPIC_API_KEY an
# und ergänzt es unten unter `env`.

on:
  push:
    paths:
      - '.sdd/specs/**.md'
    branches:
      - main

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install sdd-cli
        run: pip install 'sdd-cli[evaluate]'

      - name: Configure git
        run: |
          git config user.name "SDD Pipeline"
          git config user.email "sdd-bot@users.noreply.github.com"

      - name: Detect changed specs
        id: specs
        run: |
          SPECS=$(git diff --name-only HEAD~1 HEAD -- '.sdd/specs/*.md' \
            | xargs -I{} python -c \
              "import yaml; fm=open('{}').read().split('---')[1]; print(yaml.safe_load(fm).get('id',''))" \
              2>/dev/null | tr '\n' ' ')
          echo "ids=$SPECS" >> $GITHUB_OUTPUT

      - name: Run pipeline for each changed spec
        env:
          SDD_EVAL_BASE_URL: ${{ vars.SDD_EVAL_BASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for SPEC_ID in ${{ steps.specs.outputs.ids }}; do
            echo "→ sdd pipeline run $SPEC_ID --auto"
            sdd pipeline run "$SPEC_ID" --auto \
              ${{ vars.SDD_EVAL_BASE_URL && '--base-url $SDD_EVAL_BASE_URL' || '' }}
          done
