syntax = "proto3";

// Dieser Contract gehört zu SPEC-XXXX und Contract CON-XXXX.
// Änderungen erfordern Versions-Bump gemäß SemVer.

package beispiel.v1;

service BeispielService {
  // Liefert ein Beispiel anhand seiner ID.
  rpc HoleBeispiel(HoleBeispielRequest) returns (Beispiel);
}

message HoleBeispielRequest {
  string id = 1;
}

message Beispiel {
  string id = 1;
  string name = 2;
}
