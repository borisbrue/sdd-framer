openapi: 3.1.0
info:
  title: "<API-Name>"
  version: "0.1.0"
  description: |
    Dieser Contract gehört zu SPEC-XXXX und Contract CON-XXXX.
    Änderungen erfordern Versions-Bump gemäß SemVer.
  contact:
    name: "<Owner>"
servers:
  - url: "https://api.example.com/v1"
    description: "Production"

paths:
  /example:
    get:
      operationId: getExample
      summary: "Beispiel-Endpoint"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Example"
        "400":
          $ref: "#/components/responses/BadRequest"

components:
  schemas:
    Example:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

  responses:
    BadRequest:
      description: "Ungültiger Request"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
