[project]
name = "sdd-framer"
version = "0.1.36"
description = "Spec-Driven Development – CLI, Web API und Blueprint"
requires-python = ">=3.10"
authors = [{ name = "Boris" }]
license = { text = "MIT" }

dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "rich>=13.7",
    "fastapi>=0.111",
    "jinja2>=3.1",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pywebpush>=2.0",
    "python-dotenv>=1.0",
    "anthropic>=0.25",
    "pytest-cov>=7.1.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.4", "pytest>=8.0"]
ai = ["openai>=1.0"]
huggingface = ["huggingface_hub>=0.23"]
huggingface-local = ["huggingface_hub>=0.23", "transformers>=4.40", "torch>=2.0"]

[project.scripts]
sdd = "sdd_cli.main:cli"

[tool.uv.sources]
sdd-framer = { workspace = true }

[tool.uv.workspace]
members = ["tool"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"web/api/main.py" = ["E402"]
"web/api/routes/ai.py" = ["E402"]
"web/api/routes/copilot.py" = ["E402"]
"tests/integration/test_analyze_endpoint.py" = ["E402"]
"tests/integration/test_orchestrate_endpoints.py" = ["E402"]
"tests/unit/test_execute_flow.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["sdd_cli"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["tool"]
include = ["sdd_cli*"]

[tool.setuptools.package-data]
sdd_cli = [
    "blueprint/config.yaml",
    "blueprint/templates/*",
    "blueprint/templates/**/*",
    "blueprint/schemas/*",
    "web/api/*.py",
    "web/api/routes/*.py",
    "web/ui/dist/*",
    "web/ui/dist/**/*",
    "hub/templates/*",
]
