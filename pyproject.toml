[project]
name = "sdd-framer"
version = "0.1.63"
description = "Spec-Driven Development – CLI, Web API und Blueprint"
requires-python = ">=3.10"
authors = [{ name = "Boris" }]
license = { text = "MIT" }

dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "rich>=14",  # TTY_COMPATIBLE (tests/conftest.py, #124) gibt es erst ab 14.0
    "fastapi>=0.111",
    "jinja2>=3.1",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pywebpush>=2.0",
    "python-dotenv>=1.0",
    "anthropic>=0.25",
    "pytest-cov>=7.1.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.4", "pytest>=8.0"]
ai = ["openai>=1.0"]
huggingface = ["huggingface_hub>=0.23"]
huggingface-local = ["huggingface_hub>=0.23", "transformers>=4.40", "torch>=2.0"]

[project.scripts]
sdd = "sdd_cli.main:cli"

[tool.uv.sources]
sdd-framer = { workspace = true }

[tool.uv.workspace]
members = ["tool"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501: Zeilenlaenge regelt der Formatierer, nicht der Linter.
# SIM105: `try/except/pass` -> `contextlib.suppress` ist reine Schreibweise. Das
#   eigentliche Risiko an diesen Stellen ist das breite `except Exception`, und
#   `suppress(Exception)` wuerde es nur umbenennen. Wie teuer ein verschlucktes
#   Exception sein kann, zeigte routes/pipeline.py (#112).
ignore = ["E501", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tool/sdd_cli/web/api/main.py" = ["E402"]
"tool/sdd_cli/web/api/routes/ai.py" = ["E402"]
"tool/sdd_cli/web/api/routes/copilot.py" = ["E402"]
# Die Routen-Module laufen mit dem API-Verzeichnis als Arbeitsverzeichnis und
# ergaenzen sys.path, bevor sie sdd_context und sdd_cli importieren.
"tool/sdd_cli/web/api/routes/interactive.py" = ["E402"]
"tool/sdd_cli/web/api/routes/pipeline.py" = ["E402"]
# Tests richten sys.path und Umgebung ein, bevor sie die API importieren (E402).
# SIM117: verschachtelte `with` mit mehreren patch()-Kontexten sind in Tests
# lesbarer als eine zusammengefasste Zeile; ruff kann sie dort nur ueber
# ueberlange Zeilen aufloesen und laesst sie deshalb stehen.
"tests/**/*.py" = ["E402", "SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["sdd_cli"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    # Der Waechter tests/unit/test_ruff_sauber.py braucht ruff im Projekt-venv;
    # vorher kam es nur zufaellig aus /usr/bin (#112).
    "ruff>=0.16",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["tool"]
include = ["sdd_cli*"]

[tool.setuptools.package-data]
sdd_cli = [
    "blueprint/config.yaml",
    "blueprint/templates/*",
    "blueprint/templates/**/*",
    "blueprint/schemas/*",
    "web/api/*.py",
    "web/api/routes/*.py",
    "web/ui/dist/*",
    "web/ui/dist/**/*",
    "web/pwa/dist/*",
    "web/pwa/dist/**/*",
    "hub/templates/*",
]
